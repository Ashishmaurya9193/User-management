spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

spring.jpa.show-sql=true

#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Start the server on 8081 by default so it won't conflict with other local apps
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/user_service
spring.datasource.username=app_user
spring.datasource.password=Casper
spring.jpa.hibernate.ddl-auto=update

# Use the MySQL dialect when connecting to MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# Start Google login at: /oauth2/authorization/google
#Ashish Maurya

# Password reset
app.password-reset.token-ttl-minutes=30
app.password-reset.base-url=http://localhost:8081
app.password-reset.from-email=${RESET_FROM_EMAIL:no-reply@example.com}
app.password-reset.subject=Reset your password

# Gmail SMTP (use app password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
